name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
        env:
          # Configuración pública: la URL y la clave «publishable» viajan igual dentro del JavaScript.
          # Nunca poner aquí la clave secreta (service_role).
          VITE_SUPABASE_URL: https://fgdqzwqucmlkultcqkmk.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0p8ZUbJ6IK-zzRKsobQv1A_cRbD6-ez
      - name: Subir a la rama gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicación de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
